<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightgrain — dither art from any image, GIF or video</title>
<meta name="description" content="Turn any image, GIF or video into shimmering dithered pixel art. Dither patterns, palettes, pixel shapes, keyframes, a brush, text, and PNG, GIF, MP4, SVG and sticker export. Free, runs in your browser.">
<meta name="theme-color" content="#0a0a0c">
<meta property="og:title" content="Nightgrain">
<meta property="og:description" content="Turn any image, GIF or video into shimmering dithered pixel art.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://winchxyz.github.io/nightgrain/">
<meta property="og:image" content="https://winchxyz.github.io/nightgrain/docs/cover.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/Inter.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="Nightgrain">
    <svg viewBox="0 0 32 32" width="26" height="26" shape-rendering="crispEdges" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#000"/>
      <g fill="#fafef9"><rect x="13" y="4" width="9" height="3"/><rect x="10" y="7" width="6" height="3"/><rect x="7" y="10" width="6" height="9"/><rect x="7" y="19" width="9" height="3"/><rect x="10" y="22" width="12" height="3"/><rect x="13" y="25" width="9" height="3"/></g>
      <g fill="#f8932e"><rect x="19" y="4" width="3" height="3"/><rect x="13" y="7" width="3" height="3"/><rect x="10" y="13" width="3" height="3"/><rect x="13" y="19" width="3" height="3"/><rect x="19" y="22" width="3" height="3"/><rect x="22" y="19" width="3" height="3"/></g>
      <g fill="#2573ed"><rect x="16" y="10" width="3" height="3"/><rect x="22" y="13" width="3" height="3"/><rect x="16" y="16" width="3" height="3"/><rect x="25" y="7" width="3" height="3"/></g>
      <g fill="#4fb652"><rect x="19" y="13" width="3" height="3"/><rect x="25" y="16" width="3" height="3"/></g>
    </svg>
    <span>Nightgrain</span>
  </a>
  <div class="top-actions">
    <button class="btn" id="btnOpen" type="button">Open file</button>
    <span class="sep"></span>
    <button class="icon-btn" id="btnUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.500h9a5 5 0 0 1 0 10h-2"/></svg>
    </button>
    <button class="icon-btn" id="btnRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
      <svg viewBox="0 0 24 24"><path d="m15 7 4.500 4.500L15 16"/><path d="M19 11.500h-9a5 5 0 0 0 0 10h2"/></svg>
    </button>
    <button class="btn ghost" id="btnCompare" type="button" title="Hold to see the original">Original</button>
    <a class="icon-btn" href="https://github.com/winchxyz/nightgrain" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub">
      <svg viewBox="0 0 24 24" class="fill"><path d="M12 2.500a9.500 9.500 0 0 0-3 18.510c.470.090.650-.200.650-.450v-1.700c-2.640.570-3.200-1.130-3.200-1.130-.430-1.100-1.050-1.390-1.050-1.390-.860-.590.070-.580.070-.580.950.070 1.450.980 1.450.980.850 1.450 2.220 1.030 2.760.790.090-.610.330-1.030.600-1.270-2.110-.240-4.330-1.050-4.330-4.690 0-1.040.370-1.880.980-2.550-.100-.240-.420-1.210.090-2.520 0 0 .800-.260 2.610.970a9 9 0 0 1 4.750 0c1.810-1.230 2.610-.970 2.610-.970.510 1.310.190 2.280.090 2.520.610.670.980 1.510.980 2.550 0 3.650-2.220 4.450-4.340 4.690.340.290.640.870.640 1.760v2.610c0 .250.170.550.660.450A9.500 9.500 0 0 0 12 2.500z"/></svg>
    </a>
  </div>
</header>

<main class="work">
  <section class="stage">
    <div class="viewport" id="viewport">
      <canvas id="view" width="16" height="16"></canvas>
      <div class="pick-note" id="pickNote" hidden>Click the colour to remove</div>
      <div class="drop" id="drop" hidden><div>Drop an image, GIF or video</div></div>
    </div>
    <div class="transport">
      <button class="icon-btn" id="btnPlay" type="button" aria-label="Play or pause" title="Play or pause (Space)">
        <svg viewBox="0 0 24 24" class="fill" id="icoPlay"><path d="M8 5.500v13l11-6.500z"/></svg>
      </button>
      <div class="scrub-wrap">
        <input type="range" id="scrub" class="scrub" min="0" max="1" step="0.001" value="0" aria-label="Position in the loop">
        <div class="ticks" id="ticks"></div>
      </div>
      <span class="mono" id="timeLabel">0.0 / 4.8 s</span>
      <span class="grow"></span>
      <span class="mono muted" id="infoLabel"></span>
    </div>
  </section>

  <aside class="side">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <div class="panel">
      <div class="panel-scroll" id="panel"></div>
      <div class="help" id="help">Hover any control to see what it does.</div>
    </div>
  </aside>
</main>

<input type="file" id="file" accept="image/*,video/*,.gif,.webp,.apng,.mp4,.mov,.webm,.mkv" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
